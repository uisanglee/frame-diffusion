version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    open-pull-requests-limit: 5
    ignore:
      # VLM major versions can change model classes and generation APIs.
      - dependency-name: transformers
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    open-pull-requests-limit: 5
