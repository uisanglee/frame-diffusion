[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-diffusion"
version = "0.1.0"
description = "Executable tree-edit denoising for frontend layout repair"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [{name = "FrameDiff contributors"}]
keywords = ["program synthesis", "layout", "diffusion", "frontend", "machine learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.5,<3", "numpy>=1.26", "scipy>=1.12", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/uisanglee/frame-diffusion"
Repository = "https://github.com/uisanglee/frame-diffusion"
Issues = "https://github.com/uisanglee/frame-diffusion/issues"

[project.optional-dependencies]
browser = ["playwright>=1.48"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]
vlm = ["transformers>=4.57,<6", "accelerate>=1.0", "torchvision>=0.20", "qwen-vl-utils>=0.0.14", "bitsandbytes>=0.45; sys_platform == 'linux'"]
data = ["huggingface-hub>=0.26", "datasets>=3"]

[project.scripts]
framediff = "framediff.cli:main"

[tool.setuptools.packages.find]
include = ["framediff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires Playwright Chromium"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E741"]
