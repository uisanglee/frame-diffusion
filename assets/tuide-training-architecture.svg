<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <linearGradient id="imageBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="domBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9f3"/><stop offset="1" stop-color="#dff2e6"/>
    </linearGradient>
    <linearGradient id="fusionBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ecff"/><stop offset="1" stop-color="#ded5ff"/>
    </linearGradient>
    <linearGradient id="actionBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3e8"/><stop offset="1" stop-color="#ffe0c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#263247"/>
    </marker>
    <style>
      .label{font:600 27px Arial,Helvetica,sans-serif;fill:#111827}
      .box{stroke:#273246;stroke-width:2.4;filter:url(#shadow)}
      .arrow{fill:none;stroke:#263247;stroke-width:4;marker-end:url(#arrow)}
      .ui{stroke:#516174;stroke-width:2;fill:#fff}
    </style>
  </defs>

  <!-- Target Image -->
  <g transform="translate(48 74)">
    <rect class="box" width="280" height="226" rx="18" fill="#fff"/>
    <rect width="280" height="42" rx="18" fill="#f3f5f8"/>
    <path d="M0 42H280" stroke="#273246" stroke-width="2"/>
    <circle cx="24" cy="21" r="7" fill="#ff6258"/><circle cx="47" cy="21" r="7" fill="#ffbe3e"/><circle cx="70" cy="21" r="7" fill="#38c95c"/>
    <rect class="ui" x="17" y="59" width="55" height="145" rx="6" fill="#bdeccf"/>
    <rect class="ui" x="87" y="59" width="176" height="42" rx="6" fill="#bdeccf"/>
    <rect class="ui" x="87" y="115" width="80" height="42" rx="6" fill="#d5e6ff"/>
    <rect class="ui" x="183" y="115" width="80" height="42" rx="6" fill="#d5e6ff"/>
    <rect class="ui" x="87" y="171" width="176" height="33" rx="6" fill="#eadfff"/>
    <text class="label" x="140" y="266" text-anchor="middle">Target Image</text>
  </g>

  <!-- Current Image -->
  <g transform="translate(48 458)">
    <rect class="box" width="280" height="226" rx="18" fill="#fff"/>
    <rect width="280" height="42" rx="18" fill="#f3f5f8"/>
    <path d="M0 42H280" stroke="#273246" stroke-width="2"/>
    <circle cx="24" cy="21" r="7" fill="#ff6258"/><circle cx="47" cy="21" r="7" fill="#ffbe3e"/><circle cx="70" cy="21" r="7" fill="#38c95c"/>
    <rect class="ui" x="17" y="59" width="55" height="145" rx="6" fill="#bdeccf"/>
    <rect class="ui" x="87" y="59" width="104" height="42" rx="6" fill="#bdeccf"/>
    <rect class="ui" x="87" y="115" width="80" height="42" rx="6" fill="#d5e6ff"/>
    <rect class="ui" x="174" y="128" width="89" height="58" rx="6" fill="#d5e6ff"/>
    <rect class="ui" x="87" y="171" width="176" height="33" rx="6" fill="#eadfff"/>
    <text class="label" x="140" y="266" text-anchor="middle">Current Image</text>
  </g>

  <!-- Image Encoder -->
  <rect class="box" x="446" y="191" width="300" height="150" rx="24" fill="url(#imageBox)"/>
  <text class="label" x="596" y="278" text-anchor="middle">Image Encoder</text>

  <!-- Current DOM/CSS -->
  <g transform="translate(414 487)">
    <path class="box" d="M0 0H210L258 48V174H0Z" fill="#fffdf7"/>
    <path d="M210 0V48H258" fill="#f1e8d5" stroke="#273246" stroke-width="2.4"/>
    <path d="M32 52H180M32 82H221M32 112H190M32 142H219" stroke="#87909e" stroke-width="8" stroke-linecap="round"/>
    <text class="label" x="129" y="216" text-anchor="middle">Current DOM/CSS</text>
  </g>

  <!-- Structured encoder -->
  <rect class="box" x="820" y="439" width="340" height="166" rx="24" fill="url(#domBox)"/>
  <text class="label" x="990" y="506" text-anchor="middle">
    <tspan x="990" dy="0">Structured</tspan><tspan x="990" dy="36">DOM/CSS Encoder</tspan>
  </text>

  <!-- Fusion -->
  <rect class="box" x="1225" y="254" width="310" height="170" rx="32" fill="url(#fusionBox)"/>
  <text class="label" x="1380" y="326" text-anchor="middle">
    <tspan x="1380" dy="0">Visual–DOM</tspan><tspan x="1380" dy="36">Cross Attention</tspan>
  </text>

  <!-- Decoder -->
  <rect class="box" x="1601" y="254" width="170" height="170" rx="32" fill="url(#actionBox)"/>
  <text class="label" x="1686" y="331" text-anchor="middle">
    <tspan x="1686" dy="0">Action</tspan><tspan x="1686" dy="34">Decoder</tspan>
  </text>

  <!-- Data flow -->
  <path class="arrow" d="M328 187H382Q410 187 410 215V237Q410 266 446 266"/>
  <path class="arrow" d="M328 571H382Q410 571 410 542V315Q410 286 446 286"/>
  <path class="arrow" d="M672 574H820"/>
  <path class="arrow" d="M746 266H1095Q1130 266 1150 291L1225 335"/>
  <path class="arrow" d="M1160 522H1190Q1210 522 1210 495V405Q1210 374 1225 374"/>
  <path class="arrow" d="M1535 339H1601"/>
</svg>
